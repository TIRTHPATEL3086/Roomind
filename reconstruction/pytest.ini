[pytest]
# The steps import each other as `from utils.geometry import ...`, matching how
# pipeline.py runs them. Putting the package root on sys.path here means the
# tests exercise the same import graph the pipeline does, rather than a
# rewritten one that only works under pytest.
pythonpath = .
testpaths = tests
markers =
    slow: renders frames or runs the pose optimiser (minutes, not seconds)
